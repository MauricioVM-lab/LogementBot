# Place this file in your repository at: .github/workflows/veille.yml

name: Veille logement CROUS

on:
  schedule:
    # GitHub's own scheduler is best-effort and unreliable at 5-minute
    # intervals (real-world gaps of 2-3h observed). The actual 5-minute
    # cadence comes from an external cron service calling workflow_dispatch
    # via the REST API. This hourly schedule is only a fallback in case
    # that external trigger goes down.
    - cron: "0 * * * *"

  # Also allow manual runs from the Actions tab, which is handy for testing.
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Diagnostic mode (print a report, send no alert)"
        type: boolean
        default: false

# Prevent two runs from overlapping.
concurrency:
  group: veille-crous
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run the watcher
        env:
          CROUS_URL: ${{ secrets.CROUS_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAGNOSE: ${{ github.event.inputs.diagnose == 'true' && '1' || '' }}
        run: python veille_crous.py
